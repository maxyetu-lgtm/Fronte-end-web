<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atypical Lounge — Criar conta</title>
</head>
<body>

<h1>Criar conta no Atypical Lounge</h1>

<form id="signup-form" action="https://postman-echo.com/post" method="post">

  <fieldset>
    <legend>Dados pessoais</legend>

    <div>
      <label for="fullname">Nome completo *</label><br>
      <input type="text" id="fullname" name="fullname" placeholder="Ex: Ana Beatriz Souza" required minlength="3">
    </div>

    <div>
      <label for="birthdate">Data de nascimento</label><br>
      <input type="date" id="birthdate" name="birthdate" required>
    </div>

    <div>
      <label for="phone">Telefone (com DDD)</label><br>
      <input type="tel" id="phone" name="phone" placeholder="(41) 91234-5678"
             pattern="^\(\d{2}\)\s?\d{4,5}-\d{4}$">
    </div>

    <div>
      <label for="city">Cidade</label><br>
      <input type="text" id="city" name="city" placeholder="Ex: Assaí, PR">
    </div>
  </fieldset>

  <fieldset>
    <legend>Acesso</legend>

    <div>
      <label for="username">Nome de usuário * (letras, números e _)</label><br>
      <input type="text" id="username" name="username" placeholder="Ex: ana_bs"
             pattern="^[a-zA-Z0-9_]{4,16}$" required>
    </div>

    <div>
      <label for="email">E-mail *</label><br>
      <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
    </div>

    <div>
      <label for="password">Senha * (mín. 8 caracteres, com letra e número)</label><br>
      <input type="password" id="password" name="password" placeholder="Mín. 8 caracteres"
             pattern="^(?=.*[A-Za-z])(?=.*\d).{8,}$" required>
    </div>

    <div>
      <label for="password2">Confirmar senha *</label><br>
      <input type="password" id="password2" name="password2" placeholder="Repita a senha" required>
    </div>
  </fieldset>

  <fieldset>
    <legend>Perfil</legend>

    <div>
      <label for="bio">Bio</label><br>
      <textarea id="bio" name="bio" placeholder="Conte um pouco sobre você..." maxlength="200"></textarea>
    </div>

    <div>
      <label for="pronoun">Pronome</label><br>
      <select id="pronoun" name="pronoun">
        <option value="">Prefiro não dizer</option>
        <option value="ela">Ela/dela</option>
        <option value="ele">Ele/dele</option>
        <option value="elu">Elu/delu</option>
        <option value="outro">Outro</option>
      </select>
    </div>

    <div>
      <label>Interesses</label><br>
      <label><input type="checkbox" name="interests" value="tecnologia"> Tecnologia</label>
      <label><input type="checkbox" name="interests" value="arte"> Arte</label>
      <label><input type="checkbox" name="interests" value="jogos"> Jogos</label>
      <label><input type="checkbox" name="interests" value="musica"> Música</label>
      <label><input type="checkbox" name="interests" value="bem-estar"> Bem-estar</label>
    </div>

    <div>
      <label>Visibilidade do perfil</label><br>
      <label><input type="radio" name="visibility" value="publico" checked> Público</label>
      <label><input type="radio" name="visibility" value="amigos"> Só amigos</label>
      <label><input type="radio" name="visibility" value="privado"> Privado</label>
    </div>

    <div>
      <label>
        <input type="checkbox" id="terms" name="terms" value="aceito" required>
        Li e aceito os termos de uso *
      </label>
    </div>
  </fieldset>

  <button type="submit">Criar conta</button>
  <div id="status"></div>
</form>

<div id="result" style="display:none;">
  <h2>Resposta do servidor (Postman Echo)</h2>
  <p>JSON devolvido pelo endpoint — os mesmos dados enviados aparecem no campo "json".</p>
  <pre id="response-json"></pre>
</div>

<script>
const form = document.getElementById('signup-form');
const statusEl = document.getElementById('status');
const resultBox = document.getElementById('result');
const responseJsonEl = document.getElementById('response-json');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  statusEl.textContent = '';

  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  if (password !== password2) {
    statusEl.textContent = 'As senhas não coincidem.';
    return;
  }

  const submitBtn = form.querySelector('button[type=submit]');
  submitBtn.disabled = true;
  statusEl.textContent = 'Enviando...';

  const formData = new FormData(form);

  try {
    const response = await fetch(form.action, {
      method: 'POST',
      body: formData
    });
    const data = await response.json();

    responseJsonEl.textContent = JSON.stringify(data, null, 2);
    resultBox.style.display = 'block';
    statusEl.textContent = 'Status ' + response.status + ' — conta simulada com sucesso.';

    // Salva o JSON da resposta em disco, para anexar como entregável
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'resposta-postman-echo.json';
    a.textContent = 'Baixar JSON da resposta';
    statusEl.appendChild(document.createElement('br'));
    statusEl.appendChild(a);

  } catch (err) {
    statusEl.textContent = 'Erro ao enviar: ' + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>

</body>
</html>
