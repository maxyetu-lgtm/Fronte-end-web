<!DOCTYPE html>
<html>
    <head>
        <meta charset="UFT-8">
        <meta name="viewport"  content="width=device-width-scale=1.0">
        <link real="stylesheet" href="./styles/global.CSS">
        <link real="icon" href="./imagens/block.png" type="imagen/x-icon">
        <title>conhecendo os displays</title>

    </head>
    <body>
       <header>
        <h1> conhecendo os displays do CSS</h1>
       </header>
       <main>
        <section>
          <h2> display block</h2>
          <div class="content-block">
          <div class="item">item 1 </div>
          <div class="item">item 2 </div>
          <div class="item">item 3 </div>
          </div>
          <p> elementos são blocos que ocupam a linha toda</p>
        </section>
        <section>
          <h2> display inline</h2>
          <div class="content-inline">
          <div class="item">item 1 </div>
          <div class="item">item 2 </div>
          <div class="item">item 3 </div>
          </div>
          <p> elementos ficam em linha e respetam o tamanho do conteúdo textual</p>
        </section>
    </main>
    <footer>
        <p>projeto de compreenção de display no CSS</p>
    </footer>
    </body>
</html>
